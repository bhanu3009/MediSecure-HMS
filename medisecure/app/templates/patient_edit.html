{% extends "base.html" %}

{% block content %}
    
    <h2>Edit Patient: {{ patient.name }}</h2>
    
    <form action="/api/patients/web/{{ patient.id }}/edit" method="POST">
        <label>Email:</label>
        <input type="email" name="email" value="{{ patient.email }}" required>
        <br><br>
        
        <label>Phone:</label>
        <input type="text" name="phone" value="{{ patient.phone }}" required>
        <br><br>
        
        <button type="submit">Save Changes</button>
        <a href="/api/patients/web" style="margin-left: 15px; color: #7f8c8d; text-decoration: none;">Cancel</a>
    </form>

{% endblock %}
