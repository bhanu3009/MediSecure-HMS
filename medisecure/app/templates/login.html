<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediSecure - Auth Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #000; }
        .login-box { background: #0d0d0d; padding: 40px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05); width: 350px; text-align: center; }
        .login-box h2 { color: #eab308; margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; background: #121212; border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; border-radius: 4px; box-sizing: border-box; }
        .login-btn { width: 100%; padding: 12px; background: #eab308; color: #000; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .login-btn:hover { background: #ca9a04; box-shadow: 0 0 10px rgba(234, 179, 8, 0.4); }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>System Access</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" class="login-input" placeholder="Staff Username" required>
            <input type="password" name="password" class="login-input" placeholder="Password" required>
            
            <button type="submit" class="login-btn">Authenticate</button>
        </form>
    </div>

</body>
</html>
